<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLOG APP - {% block title %} {% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css'%}">
    <script src="{% static 'script/javascript.js' %}"></script>
</head>
<body>
    <nav>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'users:register' %}">Register</a>
        <a href="{% url 'users:login' %}">Login</a>
        <a href="{% url 'users:logout' %}">Logout</a>
        <a href="{% url 'users:dashboard' %}">Dashboard</a>
        <a href="{% url 'posts:add_post' %}">Create Post</a>
        <a href="{% url 'posts:view_posts' %}">Posts List</a>
        <a href="{% url 'products:show_products' %}">Products List</a>
    </nav>
    <div>
        <div class="text-center bg-green-900 text-white py-1 px-3 rounded-lg font-bold">message</div>
        {% block body %} {% endblock %}
    </div>
</body>
</html>
