{% extends 'layout.html' %}

{% block title %} POST LISTS PAGE {% endblock %}

{% block body %} 
<div>
    <h1>welcome to the posts list page</h1>
    {% for post in posts %}
    <div>
        <h2>{{ post.id }}</h2>
        <h2>{{ post.title }}</h2>
        <h2>{{ post.text }}</h2>
        <h2>{{ post.createdAt }}</h2>
    </div>
    {% endfor %}
</div>
{% endblock %}
